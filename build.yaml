# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#

include:
  - board: nice_nano//zmk
    shield: klotz_left
    artifact-name: klotz_ble_left
  - board: nice_nano//zmk
    shield: klotz_right
    artifact-name: klotz_ble_right
  - board: nice_nano//zmk
    shield: klotz_esb_left
    artifact-name: klotz_esb_left
  - board: nice_nano//zmk
    shield: klotz_esb_right
    artifact-name: klotz_esb_right
  - board: nice_nano//zmk
    shield: klotz_esb_dongle
    artifact-name: klotz_esb_dongle
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
