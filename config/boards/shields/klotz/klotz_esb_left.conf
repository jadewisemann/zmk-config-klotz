CONFIG_ZMK_KEYBOARD_NAME="Klotz ESB"

# ── split transport ────────────────────────────────────────────────────────
CONFIG_BT=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=0

# ── ESB radio ──────────────────────────────────────────────────────────────
# Everything in this block MUST match klotz_esb_right.conf and
# klotz_esb_dongle.conf exactly. A mismatch does not fail the build, it just
# gives you a link that never syncs.
#
# This keymap is timing-sensitive in a specific way: ZMK stamps a split key
# event with k_uptime_get() when it *arrives at the central* (split/central.c),
# and combo.c judges against that stamp. Transport jitter is therefore combo
# accuracy, not just latency. So everything below favours consistent delivery
# over peak rate.
#
# Polling rate: this is the TDMA *slot* length, and the loop is one slot per
# peripheral. 1 kHz => 1000us slots => each half is polled every 2ms (500 Hz).
# 2 kHz halves the slot to ~500us and, after the timeout margin, leaves under
# 400us for FHSS channel switch + ramp-up + packet + ACK turnaround - almost no
# headroom for a retry, so a marginal link desyncs instead of retransmitting.
# What 2 kHz buys is lower *inter-half* skew, and 58 of the 59 combos in this
# keymap are same-hand (only outer_thumb, 31+32, crosses halves) - so it pays
# slot margin for something this keymap barely uses.
CONFIG_ESB_POLLING_RATE_1KHZ=y

# 2 Mbps halves air time per packet, which is slot margin back. Same reasoning.
CONFIG_ZMK_SPLIT_ESB_BITRATE_2MBPS=y

CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_RINGBUF=y

# Data whitening changes the on-air packet, so it belongs in the must-match
# block even though y is also the driver default.
CONFIG_ESB_WHITEEN=y

# Send the whole key-state bitmap instead of individual press/release events.
# 40 of the 59 combos here produce modifiers, so a lost *release* in per-event
# mode means a stuck Ctrl/Gui/Alt, not a stuck letter - every keystroke after
# it gets read as a shortcut. Whole-key state self-corrects on the next report.
# The trade is real: if a packet is lost, a very fast tap can collapse into a
# no-op diff instead of arriving late. A dropped character beats a stuck
# modifier for this keymap.
CONFIG_ZMK_SPLIT_ESB_SEND_WHOLE_KEY=y

# Required by zmk-feature-split-esb (see its src/split/Kconfig help text).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# That same help text also asks for CONFIG_MPSL_TIMESLOT_SESSION_COUNT>=2, but
# the symbol does not exist in this build: ESB selects MPSL_FEM_ONLY, which is
# what gates mpsl/init/Kconfig. Setting it would be an assignment to an
# undefined symbol. This driver schedules the radio itself off RTC/TIMER and
# never opens an MPSL timeslot session, so there is nothing to configure.

# ── deliberate off-switches (these are also the Kconfig defaults; set here so
#    they read as decisions rather than as unexamined defaults) ─────────────
#
# Dedicated RX workqueue: OFF. ZMK raises split key events synchronously in
# whoever calls the transport rx handler, so turning this on moves combo and
# hold-tap *capture* onto the ESB thread while their timeouts stay on the
# system workqueue (k_work_schedule always uses it). combo.c has no locking at
# all around candidates[]/pressed_keys[], and 24 of 30 alphas here are combo
# participants, so that split would put two threads on unlocked shared state
# in exactly this keymap's hot path. Worth revisiting only if input latency is
# still a problem after the module fixes, and then with a 4096-byte stack.
CONFIG_ZMK_SPLIT_ESB_USE_WORK_QUEUE_DEDICATED=n
#
# HFCLK off after every TX: OFF. It saves peripheral power but adds a clock
# warm-up to each transmission, spending the slot margin this whole config is
# built to protect.
CONFIG_ESB_HFCLK_OFF_EVERY_TX=n

# ── hardware ───────────────────────────────────────────────────────────────
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BATTERY_REPORTING=y

# ── power ──────────────────────────────────────────────────────────────────
# Previously inherited from config/klotz.conf; now set explicitly since that
# file no longer applies to ESB builds.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_PM_SOFT_OFF=y
