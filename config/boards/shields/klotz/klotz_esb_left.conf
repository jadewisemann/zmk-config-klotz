CONFIG_ZMK_KEYBOARD_NAME="Klotz ESB"

# ── split transport ────────────────────────────────────────────────────────
CONFIG_BT=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=0

# ── ESB radio ──────────────────────────────────────────────────────────────
# Everything in this block MUST match klotz_esb_right.conf and
# klotz_esb_dongle.conf exactly. A mismatch does not fail the build, it just
# gives you a link that never syncs.
#
# Polling rate: this is the TDMA *slot* length, and the loop is one slot per
# peripheral. 1 kHz => 1000us slots => each half is polled every 2ms (500 Hz),
# which is far more than a keyboard needs. 2 kHz halves the slot to ~500us and,
# after the timeout margin, leaves under 400us for FHSS channel switch + ramp-up
# + packet + ACK turnaround - almost no headroom for a retry, so a marginal link
# desyncs instead of retransmitting. Raise this back to 2 kHz only if you also
# want to re-test range and battery life.
CONFIG_ESB_POLLING_RATE_1KHZ=y
CONFIG_ZMK_SPLIT_ESB_BITRATE_2MBPS=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_RINGBUF=y

# Send the whole key-state bitmap instead of individual press/release events.
# A lost packet then corrects itself on the next report rather than leaving a
# key stuck down until it is pressed again.
CONFIG_ZMK_SPLIT_ESB_SEND_WHOLE_KEY=y

# Required by zmk-feature-split-esb (see its src/split/Kconfig help text).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2

# ── hardware ───────────────────────────────────────────────────────────────
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BATTERY_REPORTING=y

# ── power ──────────────────────────────────────────────────────────────────
# Previously inherited from config/klotz.conf; now set explicitly since that
# file no longer applies to ESB builds.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_PM_SOFT_OFF=y
