CONFIG_ZMK_KEYBOARD_NAME="Klotz Dongle"

# ── split transport ────────────────────────────────────────────────────────
CONFIG_BT=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Number of ESB peripherals. The module also uses this as the TDMA pipe count,
# so it must equal the number of halves actually paired.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# ── ESB radio ──────────────────────────────────────────────────────────────
# Keep this block byte-identical to klotz_esb_left.conf and
# klotz_esb_right.conf. See klotz_esb_left.conf for why the polling rate is
# 1 kHz rather than 2 kHz.
CONFIG_ESB_POLLING_RATE_1KHZ=y
CONFIG_ZMK_SPLIT_ESB_BITRATE_2MBPS=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_RINGBUF=y
CONFIG_ESB_WHITEEN=y

CONFIG_ZMK_SPLIT_ESB_SEND_WHOLE_KEY=y

# See klotz_esb_left.conf for why MPSL_TIMESLOT_SESSION_COUNT is not set here.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Deliberate off-switches - rationale in klotz_esb_left.conf. The central is
# the one that runs the keymap, so the workqueue argument applies hardest here.
CONFIG_ZMK_SPLIT_ESB_USE_WORK_QUEUE_DEDICATED=n
CONFIG_ESB_HFCLK_OFF_EVERY_TX=n

# The central drains both peripherals' uplinks, so give it a deeper RX FIFO.
CONFIG_ESB_RX_FIFO_SIZE=32

# ── combos ─────────────────────────────────────────────────────────────────
# The dongle is the central, so it is the half that runs the keymap and the
# combo engine. Same value and same reasoning as config/klotz_left.conf: 59
# combos, 40 of them modifiers meant to be held together, and a full
# active_combos[] makes activate_combo() drop the combo instead of pressing it.
#
# The BLE central's inbound-queue fix has no counterpart here on purpose.
# ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE lives under `if ZMK_SPLIT_BLE`, and
# this build sets ZMK_SPLIT_BLE=n; the ESB module raises position events
# synchronously from its rx handler with no message queue in between, so there
# is no queue here to overflow. SEND_WHOLE_KEY above is what covers the
# equivalent risk on this transport.
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

# ── host side ──────────────────────────────────────────────────────────────
CONFIG_ZMK_USB=y
CONFIG_ZMK_BACKLIGHT=n

# ── battery ────────────────────────────────────────────────────────────────
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Previously came in via config/klotz.conf; without it the halves' battery
# levels are fetched but never reported to the host.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ── power ──────────────────────────────────────────────────────────────────
# The dongle is bus powered and is the only thing holding the link up. It must
# never idle-sleep or soft-off: nothing would bring the radio back.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n
