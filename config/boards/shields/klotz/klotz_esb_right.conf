CONFIG_ZMK_KEYBOARD_NAME="Klotz ESB"

# ── split transport ────────────────────────────────────────────────────────
CONFIG_BT=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=1

# ── ESB radio ──────────────────────────────────────────────────────────────
# Keep this block byte-identical to klotz_esb_left.conf and
# klotz_esb_dongle.conf. See klotz_esb_left.conf for why the polling rate is
# 1 kHz rather than 2 kHz.
CONFIG_ESB_POLLING_RATE_1KHZ=y
CONFIG_ZMK_SPLIT_ESB_BITRATE_2MBPS=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_RINGBUF=y
CONFIG_ESB_WHITEEN=y

CONFIG_ZMK_SPLIT_ESB_SEND_WHOLE_KEY=y

# See klotz_esb_left.conf for why MPSL_TIMESLOT_SESSION_COUNT is not set here.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Deliberate off-switches - rationale in klotz_esb_left.conf.
CONFIG_ZMK_SPLIT_ESB_USE_WORK_QUEUE_DEDICATED=n
CONFIG_ESB_HFCLK_OFF_EVERY_TX=n

# ── hardware ───────────────────────────────────────────────────────────────
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BATTERY_REPORTING=y

# ── power ──────────────────────────────────────────────────────────────────
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_PM_SOFT_OFF=y
