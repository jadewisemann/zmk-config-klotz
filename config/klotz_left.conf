# BLE build, left half (split central).
#
# This file used to be config/klotz.conf. ZMK resolves user config files by
# progressively trimming the shield name, so "klotz.conf" also matched
# klotz_esb_left / klotz_esb_right / klotz_esb_dongle: every ESB build pulled in
# CONFIG_BT=y and the BLE-only options below and then had to override them again
# via EXTRA_CONF_FILE. Naming the file per half keeps it out of the ESB builds.

# LIGTHING
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=10

# BLUETOOTH
CONFIG_BT=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLUETOOTH > SPLIT KEYBOARD
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# BLUETOOTH > WIN 11
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# BLUETOOTH > SLEEP
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# POWER
CONFIG_ZMK_PM_SOFT_OFF=y
