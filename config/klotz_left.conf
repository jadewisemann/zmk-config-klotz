# BLE build, left half (split central).
#
# This file used to be config/klotz.conf. ZMK resolves user config files by
# progressively trimming the shield name, so "klotz.conf" also matched
# klotz_esb_left / klotz_esb_right / klotz_esb_dongle: every ESB build pulled in
# CONFIG_BT=y and the BLE-only options below and then had to override them again
# via EXTRA_CONF_FILE. Naming the file per half keeps it out of the ESB builds.

# LIGTHING
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=10

# BLUETOOTH
CONFIG_BT=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLUETOOTH > SPLIT KEYBOARD
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# BLUETOOTH > WIN 11
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# BLUETOOTH > SPLIT KEYBOARD > INBOUND EVENT QUEUE
#
# This is the stuck-key fix. The default of 5 is what makes right-hand keys
# latch down, home-row mod combos stay held, and NUM/NAV get stuck on.
#
# The peripheral half already sends whole key state, not per-key events:
# service.c notifies the entire position_state bitmap on every change, so a lost
# *packet* is self-correcting - the next notification carries the truth. That is
# the same property klotz_esb_*.conf buys deliberately with SEND_WHOLE_KEY.
#
# The central then throws that property away. In split_central_notify_func it
# diffs the incoming bitmap against slot->position_state, commits the new state
# immediately, and *then* pushes one edge event per changed position:
#
#     slot->changed_positions[i] = data[i] ^ slot->position_state[i];
#     slot->position_state[i]    = data[i];          // committed first
#     ...
#     k_msgq_put(&peripheral_event_msgq, &ev, K_NO_WAIT);   // return ignored
#
# The put is K_NO_WAIT and its return value is discarded, so a full queue drops
# the event silently - and because the state was already committed, the next
# notification diffs against the updated bitmap and never re-emits the lost
# transition. Whole key state went in, an unrecoverable edge event came out.
# A dropped press is a missing character. A dropped *release* is forever: the
# position stays down until the halves reconnect and release_peripheral_slot()
# flushes it.
#
# That queue is drained by peripheral_event_work_callback on the system
# workqueue, and the drain raises zmk_position_state_changed synchronously - so
# combos, hold-taps, HID assembly and the BLE notify to the host all run before
# the next entry is dequeued. Combo and hold-tap timeouts land on that same
# workqueue (k_work_schedule always uses it). Meanwhile the peripheral can have
# 10 notifications in flight (PERIPHERAL_POSITION_QUEUE_SIZE below) and each one
# expands into up to two edge events here. The receive side being half the send
# side is the whole problem; 5 is a handful of milliseconds of head start.
#
# 64 entries at 16 bytes/entry is 1 KB of RAM on a 256 KB part. Cheap insurance
# against a failure mode whose only recovery is unplugging a half.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64

# Behaviors sent central -> peripheral (backlight state, mainly - both halves
# build with ZMK_BACKLIGHT=y). split_bt_invoke_behavior_payload queues with
# K_MSEC(100), so when this queue is full the *caller* blocks for up to 100ms.
# The caller here is the system workqueue, i.e. the same thread that drains the
# inbound queue above. A 100ms stall there is exactly the window in which the
# inbound queue overflows. Give it room so the blocking path is never reached.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=32

# COMBOS
#
# The left half is the split central, so it is the half that runs the keymap and
# therefore the combo engine; this belongs here rather than in a shared file.
#
# This keymap has 59 combos and treats them as its modifier layer - 40 of them
# emit modifiers, and they are meant to be *held* while other keys (and other
# combos) are used. active_combos[] is sized by this option, and when it is full
# activate_combo() calls release_pressed_keys() and returns without ever pressing
# the behavior: the combo silently does not fire. Four concurrent held combos is
# not a stretch here, it is a normal chord.
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8


# BLUETOOTH > SLEEP
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# POWER
CONFIG_ZMK_PM_SOFT_OFF=y
