  # Pinned so a given commit of this repo always builds the same firmware.
  # Keep the shared projects in sync with config-esb/west.yml when bumping.
  # Extra modules go under modules/ so the CI west cache (which caches
  # modules/, zephyr/, zmk/, ...) contains them. Do the same for new ones.
  projects:
