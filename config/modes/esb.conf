# Every ESB build: left half, right half and dongle.

# ── split transport ────────────────────────────────────────────────────────
CONFIG_BT=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

# ── ESB radio ──────────────────────────────────────────────────────────────
# One file for all three devices, so these always match. A mismatch does not
# fail the build, it just gives a link that never syncs.
#
# The keymap is timing-sensitive in a specific way: ZMK stamps a split key
# event with k_uptime_get() when it *arrives at the central* (split/central.c),
# and combo.c judges against that stamp. Transport jitter is therefore combo
# accuracy, not just latency, so everything below favours consistent delivery
# over peak rate.
#
# Polling rate: this is the TDMA *slot* length, one slot per peripheral.
# 1 kHz => 1000us slots => each half is polled every 2ms (500 Hz).
# 2 kHz halves the slot to ~500us and, after the timeout margin, leaves under
# 400us for FHSS channel switch + ramp-up + packet + ACK turnaround - almost no
# headroom for a retry, so a marginal link desyncs instead of retransmitting.
# What 2 kHz buys is lower *inter-half* skew, and nearly every combo in this
# keymap is same-hand.
CONFIG_ESB_POLLING_RATE_1KHZ=y

# 2 Mbps halves air time per packet, which is slot margin back.
CONFIG_ZMK_SPLIT_ESB_BITRATE_2MBPS=y

CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_RINGBUF=y

# Data whitening changes the on-air packet, so it must match too.
CONFIG_ESB_WHITEEN=y

# Send the whole key-state bitmap instead of individual press/release events.
# Most combos here produce modifiers, so a lost *release* in per-event mode is
# a stuck Ctrl/Gui/Alt. Whole-key state self-corrects on the next report, and
# the module re-sends it after failed sends and on reconnect (stuck-key fix).
CONFIG_ZMK_SPLIT_ESB_SEND_WHOLE_KEY=y

# Required by zmk-feature-split-esb (see its src/split/Kconfig help text).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# The same help text asks for CONFIG_MPSL_TIMESLOT_SESSION_COUNT>=2, but the
# symbol does not exist in this build: ESB selects MPSL_FEM_ONLY, which gates
# mpsl/init/Kconfig. This driver schedules the radio itself and never opens an
# MPSL timeslot session.

# ── deliberate off-switches (also the defaults; stated as decisions) ───────
# Dedicated RX workqueue: OFF. It would move combo/hold-tap *capture* onto the
# ESB thread while their timeouts stay on the system workqueue, and combo.c has
# no locking around its shared state.
CONFIG_ZMK_SPLIT_ESB_USE_WORK_QUEUE_DEDICATED=n
# HFCLK off after every TX: OFF. Saves peripheral power but adds clock warm-up
# to each transmission, spending the slot margin this config protects.
CONFIG_ESB_HFCLK_OFF_EVERY_TX=n
