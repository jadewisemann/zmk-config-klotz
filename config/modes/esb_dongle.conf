# ESB dongle (split central, USB to the host).
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y

# Number of ESB peripherals. The module also uses this as the TDMA pipe count,
# so it must equal the number of halves actually paired.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# The central drains both peripherals' uplinks, so give it a deeper RX FIFO.
CONFIG_ESB_RX_FIFO_SIZE=32

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Bus powered and the only thing holding the link up: never sleep.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n
