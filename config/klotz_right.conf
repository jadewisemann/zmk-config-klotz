# BLE build, right half (split peripheral).
#
# Same story as klotz_left.conf: keep the BLE-only options here rather than in a
# shared klotz.conf, which ZMK would also apply to the klotz_esb_* shields.
# The CENTRAL_BATTERY_* options live in klotz_left.conf only - they have no
# effect on a peripheral.

# LIGTHING
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=10

# BLUETOOTH
CONFIG_BT=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLUETOOTH > WIN 11
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# BLUETOOTH > SPLIT KEYBOARD > OUTBOUND EVENT QUEUE
#
# The peripheral side of the stuck-key fix in klotz_left.conf. Less critical
# than the central's queue, because what is queued here is a *snapshot* of the
# whole position bitmap, not an edge event: on overflow send_position_state()
# pops the oldest snapshot and requeues, and the newest snapshot still carries
# the complete truth, so nothing is lost that the next notify does not restore.
#
# It is raised anyway for the blocking path. send_position_state() queues with
# K_MSEC(100), and it is called straight out of the key-position handler - so a
# full queue stalls key scanning itself for up to 100ms. 32 snapshots at 5 bytes
# (POS_STATE_LEN for 34 keys, padded) is a couple hundred bytes to make sure
# that path stays unreachable.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=32


# BLUETOOTH > SLEEP
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# POWER
CONFIG_ZMK_PM_SOFT_OFF=y
