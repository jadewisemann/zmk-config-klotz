# BLE build, right half (split peripheral).
#
# Same story as klotz_left.conf: keep the BLE-only options here rather than in a
# shared klotz.conf, which ZMK would also apply to the klotz_esb_* shields.
# The CENTRAL_BATTERY_* options live in klotz_left.conf only - they have no
# effect on a peripheral.

# LIGTHING
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=10

# BLUETOOTH
CONFIG_BT=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLUETOOTH > WIN 11
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# BLUETOOTH > SLEEP
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# POWER
CONFIG_ZMK_PM_SOFT_OFF=y
