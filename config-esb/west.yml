manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
    - name: duckyb
      url-base: https://github.com/duckyb
    - name: jadewisemann
      url-base: https://github.com/jadewisemann
    - name: kumbung01
      url-base: https://github.com/kumbung01
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
  # Revisions are pinned on purpose. `revision: main` meant every CI run could
  # pick up a different ZMK / module tree, so the same commit of this repo did
  # not produce the same firmware twice - and the ESB module tracks ZMK's split
  # transport API, which is still moving.
  # Extra modules go under modules/ so the CI west cache (which caches
  # modules/, zephyr/, zmk/, ...) contains them. Do the same for new ones.
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: 268b1b1e82150460f00fd701bcd08583d5c75d29
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: bc114546392b4615ac90a99140eaf21dde31209d
      path: modules/zmk-helpers
    - name: zmk-auto-layer
      remote: urob
      revision: 62c201934711369d50a28df12e1d055d05cb6460
      path: modules/zmk-auto-layer
    - name: zmk-tri-state
      remote: dhruvinsh
      revision: ebbc1f0ccdb51669650bb0ac3e34920d09e62400
      path: modules/zmk-tri-state
    # Urchin shield (34 keys, nice!nano).
    - name: urchin-zmk-module
      remote: duckyb
      revision: a3ab64fa7779f82675695f3d7d17f705f840da25
      path: modules/urchin-zmk-module
    # Our own fork, so RX-framing / sleep fixes actually land in the build.
    # Upstream is kumbung01/zmk-feature-split-esb.
    # 57a31ec adds whole-key state resync on reconnect / failed sends - the
    # stuck-key fix. Lost releases used to stay lost: esb_tdma_stop() wipes the
    # TX ring via reset_tx_all(), a full ring makes send_data() fail with the
    # return ignored, and nothing re-sent the bitmap after reconnect.
    - name: zmk-feature-split-esb
      remote: jadewisemann
      revision: 57a31ec621384e736796bc50c46f1e6a4227ef3a
      path: modules/zmk-feature-split-esb
    - name: sdk-nrf
      remote: kumbung01
      revision: v3.1-branch-tdma-fhss
      path: nrf
    - name: nrfxlib
      remote: nrfconnect
      revision: v3.1-branch
      repo-path: sdk-nrfxlib
      path: nrfxlib
  self:
    path: config-esb
