name: Build firmware

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to a branch cancels its older run. On main every run finishes,
# so every main commit gets its own release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  matrix:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Keymap checks
        run: python3 tests/check_layout.py

      - name: Expand devices.yaml
        id: expand
        run: |
          yq -o=json devices.yaml | python3 scripts/matrix.py --check
          echo "matrix=$(yq -o=json devices.yaml | python3 scripts/matrix.py)" >> "$GITHUB_OUTPUT"


  # Saves the west cache for each manifest. Runs alongside the builds (they
  # never wait for it) and exits early when the cache already exists. It lives
  # in the same container as the builds so the cache key/version matches.
  cache:
    name: Cache ${{ matrix.manifest }} workspace
    needs: matrix
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      matrix:
        manifest: [config, config-esb]
    steps:
      - uses: actions/checkout@v7

      - name: Check for an existing cache
        id: exists
        uses: actions/cache/restore@v6
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            nrf/
            nrfxlib/
            optional/
          key: west-v2-${{ matrix.manifest }}-${{ hashFiles(format('{0}/west.yml', matrix.manifest)) }}
          lookup-only: true

      # Start from the previous cache for this manifest (if any), so a version
      # bump only fetches what changed instead of the whole tree.
      - name: Restore previous west workspace
        if: steps.exists.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            nrf/
            nrfxlib/
            optional/
          key: west-v2-${{ matrix.manifest }}-${{ hashFiles(format('{0}/west.yml', matrix.manifest)) }}
          restore-keys: |
            west-v2-${{ matrix.manifest }}-
            west-${{ matrix.manifest }}-

      - name: West update
        if: steps.exists.outputs.cache-hit != 'true'
        run: |
          west init -l "${{ matrix.manifest }}"
          west update --fetch-opt=--filter=tree:0

      - uses: actions/cache/save@v6
        if: steps.exists.outputs.cache-hit != 'true'
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            nrf/
            nrfxlib/
            optional/
          key: west-v2-${{ matrix.manifest }}-${{ hashFiles(format('{0}/west.yml', matrix.manifest)) }}

  # BLE and ESB builds all run at once; scripts/matrix.py packs a few
  # firmwares per job so the whole matrix fits in one wave of runners.
  build:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # One cache per manifest (the ESB manifest pulls a different nrf tree).
      # Restore only: the cache job is the one place that saves it. After a
      # manifest change this restores the previous cache and west update
      # fetches just the difference.
      - name: Restore west workspace
        id: west-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            nrf/
            nrfxlib/
            optional/
          key: west-v2-${{ matrix.manifest }}-${{ hashFiles(format('{0}/west.yml', matrix.manifest)) }}
          restore-keys: |
            west-v2-${{ matrix.manifest }}-
            west-${{ matrix.manifest }}-

      # Every revision in the manifests is pinned, so an exact cache hit is
      # already the right tree and west update can be skipped.
      - name: West init
        run: |
          west init -l "${{ matrix.manifest }}"
          # Safety net: any project missing from the cache forces an update.
          # (Line 1 of west list is this repo's manifest dir, which has no .git.)
          missing=$(west list -f "{abspath}" | tail -n +2 | while read -r p; do [ -d "$p/.git" ] || echo "$p"; done)
          if [ "${{ steps.west-cache.outputs.cache-hit }}" != "true" ] || [ -n "$missing" ]; then
            echo "west update (cache-hit=${{ steps.west-cache.outputs.cache-hit }}, missing: ${missing:-none})"
            west update --fetch-opt=--filter=tree:0
          fi
          west zephyr-export

      - name: Build
        env:
          TARGETS: ${{ matrix.targets }}
        run: python3 scripts/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: fw-${{ matrix.id }}
          path: out/*.uf2
          if-no-files-found: error

  # main keeps one rolling `latest` pre-release that is replaced on every push,
  # so the newest build is always downloadable without piling up releases.
  # Pushing a tag like v1.2.0 publishes a permanent release under that name.
  # Other branches never release; their files are on the Actions run.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          merge-multiple: true
          path: firmware

      # Every .uf2 is attached with the release in its name
      # (klotz-esb-left-v1.2.0.uf2, klotz-esb-left-20261114-2ad5930.uf2), and
      # the notes link each one per keyboard and mode.
      - name: Prepare files and notes
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            suffix=$GITHUB_REF_NAME
          else
            suffix=$(TZ=Asia/Seoul git log -1 --date=format-local:%Y%m%d --format=%cd)-${GITHUB_SHA::7}
          fi
          tag=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo latest)
          yq -o=json devices.yaml | python3 scripts/release.py firmware "$tag" "$suffix" "$(git log -1 --format=%B)"

      - name: Publish version
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.uf2 --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Replace latest
        if: github.ref_type == 'branch'
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.uf2 --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "latest (${GITHUB_SHA::7})" --notes-file notes.md
