on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build_ble:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      archive_name: firmware-ble

  build_esb:
    needs: build_ble
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-esb.yaml
      config_path: config-esb
      archive_name: firmware-esb

  publish:
    needs: [build_ble, build_esb]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: ./temp_artifacts

      - name: Unzip firmware
        run: |
          mkdir -p extracted_firmware
          if [ -f ./temp_artifacts/firmware.zip ]; then
            unzip ./temp_artifacts/firmware.zip -d ./extracted_firmware
          else
            cp ./temp_artifacts/* ./extracted_firmware/ 2>/dev/null || true
          fi

      - name: Get short SHA & Commit Subject/Body
        id: get_info
        env:
          FULL_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "short_sha=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT
          echo "safe_ref=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

          # The release name was the whole commit message, which the releases
          # API rejects past 256 characters - any commit with a real body took
          # the publish job down with a 422. Use the subject line only (the
          # body is already passed separately below) and leave room for the
          # "[branch] " prefix.
          COMMIT_SUBJECT=$(python3 -c "
          import os
          msg = os.environ.get('FULL_MSG', '')
          print(msg.split('\n', 1)[0].strip()[:180])
          ")

          COMMIT_BODY=$(python3 -c "
          import os
          msg = os.environ.get('FULL_MSG', '')
          lines = msg.split('\n')
          body = '\n'.join(lines[1:]).strip() if len(lines) > 1 else ''
          print(body)
          ")

          echo "commit_subject<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_SUBJECT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "commit_body<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "firmware-${{ steps.get_info.outputs.safe_ref }}"
          target_commitish: ${{ github.sha }}
          name: "[${{ github.ref_name }}] ${{ steps.get_info.outputs.commit_subject }}"
          body: ${{ steps.get_info.outputs.commit_body }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            extracted_firmware/*.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
