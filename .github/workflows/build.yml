name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to a branch cancels its older run. On main every run finishes,
# so every main commit gets its own release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  matrix:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
      cold: ${{ steps.cold.outputs.cold }}
    steps:
      - uses: actions/checkout@v7

      - name: Keymap checks
        run: python3 tests/check_layout.py

      - name: Expand devices.yaml
        id: expand
        run: |
          yq -o=json devices.yaml | python3 scripts/matrix.py --check
          echo "matrix=$(yq -o=json devices.yaml | python3 scripts/matrix.py)" >> "$GITHUB_OUTPUT"

      # Only check whether each manifest's west cache exists; nothing is downloaded.
      - name: Look up west cache (BLE)
        id: ble
        uses: actions/cache/restore@v6
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            nrf/
            nrfxlib/
          key: west-config-${{ hashFiles('config/west.yml') }}
          lookup-only: true

      - name: Look up west cache (ESB)
        id: esb
        uses: actions/cache/restore@v6
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            nrf/
            nrfxlib/
          key: west-config-esb-${{ hashFiles('config-esb/west.yml') }}
          lookup-only: true

      - name: Manifests that need a fresh cache
        id: cold
        run: |
          cold=()
          [ "${{ steps.ble.outputs.cache-hit }}" = "true" ] || cold+=('"config"')
          [ "${{ steps.esb.outputs.cache-hit }}" = "true" ] || cold+=('"config-esb"')
          echo "cold=[$(IFS=,; echo "${cold[*]}")]" >> "$GITHUB_OUTPUT"

  # Fill a missing west cache once per manifest, instead of every build job
  # downloading and saving the same 1 GB in parallel. Skipped when warm.
  warm:
    name: Prepare ${{ matrix.manifest }} workspace
    needs: matrix
    if: needs.matrix.outputs.cold != '[]'
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      matrix:
        manifest: ${{ fromJson(needs.matrix.outputs.cold) }}
    steps:
      - uses: actions/checkout@v7

      - name: West update
        run: |
          west init -l "${{ matrix.manifest }}"
          west update --fetch-opt=--filter=tree:0

      - uses: actions/cache/save@v6
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            nrf/
            nrfxlib/
          key: west-${{ matrix.manifest }}-${{ hashFiles(format('{0}/west.yml', matrix.manifest)) }}

  # Every firmware is its own job, BLE and ESB alike, so they all run at once.
  build:
    name: ${{ matrix.name }}
    needs: [matrix, warm]
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.warm.result != 'failure' }}
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # One cache per manifest (the ESB manifest pulls a different nrf tree).
      # Restore only: the warm job is the one place that saves it.
      - name: Restore west workspace
        id: west-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            nrf/
            nrfxlib/
          key: west-${{ matrix.manifest }}-${{ hashFiles(format('{0}/west.yml', matrix.manifest)) }}
          restore-keys: west-${{ matrix.manifest }}-

      # Every revision in the manifests is pinned, so an exact cache hit is
      # already the right tree and west update can be skipped.
      - name: West init
        run: |
          west init -l "${{ matrix.manifest }}"
          # Safety net: any project missing from the cache forces an update.
          missing=$(west list -f "{abspath}" | while read -r p; do [ -d "$p/.git" ] || echo "$p"; done)
          if [ "${{ steps.west-cache.outputs.cache-hit }}" != "true" ] || [ -n "$missing" ]; then
            echo "west update (cache-hit=${{ steps.west-cache.outputs.cache-hit }}, missing: ${missing:-none})"
            west update --fetch-opt=--filter=tree:0
          fi
          west zephyr-export

      - name: Build
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          BOARD: ${{ matrix.board }}
          SHIELD: ${{ matrix.shield }}
          KEYMAP: ${{ matrix.keymap }}
          CONFS: ${{ matrix.confs }}
          OVERLAYS: ${{ matrix.overlays }}
          DTS_FLAGS: ${{ matrix.cppflags }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          abs() { local IFS=';' out=() p; for p in $1; do out+=("$root/$p"); done; echo "${out[*]}"; }
          args=(-DZMK_CONFIG="$root/config" -DSHIELD="$SHIELD")
          [ -n "$KEYMAP" ]    && args+=(-DKEYMAP_FILE="$root/$KEYMAP")
          [ -n "$CONFS" ]     && args+=(-DEXTRA_CONF_FILE="$(abs "$CONFS")")
          [ -n "$OVERLAYS" ]  && args+=(-DEXTRA_DTC_OVERLAY_FILE="$(abs "$OVERLAYS")")
          [ -n "$DTS_FLAGS" ] && args+=(-DDTS_EXTRA_CPPFLAGS="$DTS_FLAGS")
          west build -s zmk/app -d build -b "$BOARD" -- "${args[@]}"
          mkdir -p out
          cp build/zephyr/zmk.uf2 "out/$NAME.uf2"

      - name: Kconfig
        if: ${{ !cancelled() }}
        run: grep -v -e "^#" -e "^$" build/zephyr/.config | sort || true

      - uses: actions/upload-artifact@v7
        with:
          name: fw-${{ matrix.name }}
          path: out/*.uf2
          if-no-files-found: error

  # Every main push (and every manual run) gets a new release; nothing is
  # overwritten. Manual runs from other branches are marked pre-release.
  release:
    name: Release
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          merge-multiple: true
          path: firmware

      - name: Release info
        id: info
        env:
          MESSAGE: ${{ github.event.head_commit.message || format('Manual build of {0}', github.ref_name) }}
        run: |
          stamp=$(TZ=Asia/Seoul date +%Y%m%d-%H%M)
          echo "tag=fw-${stamp}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          subject=$(printf '%s\n' "$MESSAGE" | head -n1 | cut -c1-180)
          echo "name=${stamp} ${subject}" >> "$GITHUB_OUTPUT"
          python3 scripts/release_notes.py firmware "$MESSAGE" > notes.md
          ls firmware

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.info.outputs.name }}
          body_path: notes.md
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          files: firmware/*.uf2
