include:
  - board: nice_nano//zmk
    shield: klotz_esb_left
    artifact-name: klotz_esb_left
    cmake-args: >-
      -DZMK_CONFIG=$GITHUB_WORKSPACE/config
      -DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/config/boards/shields/klotz/klotz_esb_left.conf
      -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/klotz_esb.keymap
  - board: nice_nano//zmk
    shield: klotz_esb_right
    artifact-name: klotz_esb_right
    cmake-args: >-
      -DZMK_CONFIG=$GITHUB_WORKSPACE/config
      -DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/config/boards/shields/klotz/klotz_esb_right.conf
      -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/klotz_esb.keymap
  - board: nice_nano//zmk
    shield: klotz_esb_dongle
    artifact-name: klotz_esb_dongle
    cmake-args: >-
      -DZMK_CONFIG=$GITHUB_WORKSPACE/config
      -DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/config/boards/shields/klotz/klotz_esb_dongle.conf
      -DKEYMAP_FILE=$GITHUB_WORKSPACE/config/klotz_esb_dongle.keymap
